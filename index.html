<!doctype html>
<html lang="de" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Clemio – Messenger</title>
    <meta name="description" content="Sprachnachrichten, Echtzeit-Übersetzung &amp; barrierefreie Kommunikation">
    <!-- Block browser auto-translation: Clemio handles its own i18n via the language switcher.
         Without this, Chrome/Safari overlay their own translation on top of our localized strings,
         which produces inconsistent / wrong wording (e.g. "Man hört die Leute" instead of "Du hörst Menschen"). -->
    <meta name="google" content="notranslate" />

    <!-- Allow ALL search engines (Google, Bing, DuckDuckGo, Yandex, Baidu, Brave, Ecosia, Qwant, etc.) -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- PWA Meta -->
    <meta name="theme-color" content="#F97316" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Clemio" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/png" href="/icon-192.png">

    <!-- OG -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://clemio.app/" />
    <meta property="og:title" content="Clemio – Messenger" />
    <meta property="og:description" content="Sprachnachrichten, Echtzeit-Übersetzung &amp; barrierefreie Kommunikation" />
    <meta property="og:image" content="https://clemio.app/og/clemio-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Clemio – Voice-first Messenger" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Clemio – Messenger" />
    <meta name="twitter:description" content="Sprachnachrichten, Echtzeit-Übersetzung &amp; barrierefreie Kommunikation" />
    <meta name="twitter:image" content="https://clemio.app/og/clemio-default.jpg" />

    <!-- Canonical (single, ohne www) -->
    <link rel="canonical" href="https://clemio.app/" />
    <!-- Keine hreflang-Tags: derzeit existieren keine eigenständigen lokalisierten URLs.
         Sprachumschaltung erfolgt clientseitig auf derselben URL – fehlerhaftes hreflang
         (alle Sprachen auf /) wäre schlechter als kein hreflang. -->

    <!-- Structured data: Organization + WebSite + MobileApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://clemio.app/#organization",
          "name": "Clemio",
          "url": "https://clemio.app/",
          "logo": "https://clemio.app/icon-512.png",
          "email": "support@clemio.app",
          "sameAs": ["https://clemio.app/"]
        },
        {
          "@type": "WebSite",
          "@id": "https://clemio.app/#website",
          "url": "https://clemio.app/",
          "name": "Clemio",
          "description": "Sprachnachrichten, Echtzeit-Übersetzung & barrierefreie Kommunikation",
          "inLanguage": ["de","en","es","fr","tr","ar"],
          "publisher": { "@id": "https://clemio.app/#organization" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://clemio.app/?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "MobileApplication",
          "@id": "https://clemio.app/#app",
          "name": "Clemio",
          "operatingSystem": "iOS, Android, Web, Windows",
          "applicationCategory": "CommunicationApplication",
          "description": "Voice-first Messenger mit Echtzeit-Übersetzung, KI-Stimme und barrierefreier Kommunikation.",
          "url": "https://clemio.app/",
          "image": "https://clemio.app/icon-512.png",
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
          "publisher": { "@id": "https://clemio.app/#organization" }
        }
      ]
    }
    </script>
    <meta name="google-site-verification" content="wG4Gjbx2_4F1vjFr5GV1KWpp4aJ52EAoq0I7Ns6X5hg" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
